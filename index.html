<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tap Tempo">
<meta name="theme-color" content="#0d0e12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Tap Tempo</title>
<link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts (latin subset, SIL OFL, see fonts/) so they also work offline. */
@font-face { font-family: "Big Shoulders Display"; font-weight: 100 900; font-display: swap; src: url(fonts/big-shoulders-display.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-mono-400.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: swap; src: url(fonts/ibm-plex-mono-600.woff2) format("woff2"); }

/* Layout: one-screen instrument — readout on top, a full-width pad filling the rest. Committed dark stage look. */
:root {
  --bg: #0d0e12;
  --panel: #16171d;
  --pad: #1b1d24;
  --pad-hit: #262936;
  --line: #2f3240;
  --fg: #eceef6;
  --dim: #868a9c;
  --accent: #8b9dff;
  --accent-soft: rgba(139, 157, 255, .16);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-ui: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
html {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; /* no double-tap zoom anywhere */
}
.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px;
  max-width: 560px;
  margin: 0 auto;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; color: var(--fg); }
.brand .logo { width: 22px; height: 22px; }
.tools { display: flex; gap: 8px; }
.chip {
  height: 36px; padding: 0 14px; border-radius: 18px;
  border: 1px solid var(--line); background: var(--panel);
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip .led { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.chip[aria-pressed="true"] .led { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* readout */
.readout {
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  padding: 14px 16px 12px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end;
}
.bpm {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(96px, 34vw, 168px); line-height: .82;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  color: var(--fg);
  display: flex; align-items: baseline;
  min-width: 0;
}
.bpm.idle { color: var(--line); }
.bpm .dec { font-size: .34em; font-weight: 500; color: var(--dim); margin-left: 4px; }
.unit { font-size: 12px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.side { display: flex; flex-direction: column; gap: 8px; }
.side button {
  width: 64px; height: 44px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--pad);
  font-size: 15px; font-weight: 600;
}
.side button:active { background: var(--pad-hit); }
.meta { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
.status { font-size: 12px; color: var(--dim); letter-spacing: .04em; }
.status.ok { color: var(--accent); }
.dots { display: flex; gap: 4px; }
.dots i { width: 6px; height: 14px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--accent); }

/* pad */
.pad {
  position: relative; border-radius: 28px;
  background: var(--pad); border: 1px solid var(--line);
  display: grid; place-items: center;
  touch-action: none;
  overflow: hidden;
  min-height: 180px;
  transition: background-color .25s ease;
}
.pad.hit { background: var(--pad-hit); transition: none; }
.pad::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  box-shadow: inset 0 0 0 3px var(--accent); opacity: 0;
  transition: opacity .3s ease;
}
.pad.hit::after, .pad.beat::after { opacity: .9; transition: none; }
.pad.beat.accent::after { box-shadow: inset 0 0 0 6px var(--accent); }
.pad-label { text-align: center; pointer-events: none; display: grid; gap: 8px; }
.pad-label strong { font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: .12em; color: var(--fg); }
.pad-label span { font-size: 12px; color: var(--dim); letter-spacing: .06em; }

.foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim); }
.foot button { font-size: 11px; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.toast { color: var(--accent); }

@media (prefers-reduced-motion: reduce) { .pad, .pad::after { transition: none; } }
@media (pointer: coarse) { .hint { display: none; } }
@media (max-height: 620px) {
  .bpm { font-size: clamp(72px, 26vw, 120px); }
  .pad-label strong { font-size: 32px; }
}
/* iPhone in landscape (iOS ignores the manifest orientation): readout left, pad right */
@media (orientation: landscape) and (max-height: 520px) {
  .app { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-rows: auto 1fr auto; gap: 10px 14px; padding-block: 8px 6px; }
  .bar, .foot { grid-column: 1 / -1; }
  .readout { grid-column: 1; grid-row: 2; align-content: center; }
  .pad { grid-column: 2; grid-row: 2; min-height: 0; }
  .bpm { font-size: min(120px, 27vh); }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="3.2" height="16" rx="1.6" fill="var(--accent)"/><rect x="8.6" y="8.5" width="3.2" height="7" rx="1.6" fill="var(--fg)"/><rect x="14.2" y="8.5" width="3.2" height="7" rx="1.6" fill="var(--fg)"/><rect x="19.8" y="8.5" width="3.2" height="7" rx="1.6" fill="var(--fg)"/></svg><span>Tap Tempo</span></div>
    <div class="tools">
      <button class="chip" id="clickBtn" aria-pressed="false"><span class="led"></span>Click</button>
      <button class="chip" id="resetBtn">Reset</button>
    </div>
  </header>

  <section class="readout" aria-live="polite">
    <div>
      <div class="bpm idle" id="bpm"><span id="int">---</span><span class="dec" id="dec"></span></div>
      <div class="unit">BPM</div>
    </div>
    <div class="side">
      <button id="halfBtn" aria-label="Halve tempo">÷2</button>
      <button id="doubleBtn" aria-label="Double tempo">×2</button>
    </div>
    <div class="meta">
      <span class="status" id="status">Tap 4 times to start</span>
      <span class="dots" id="dots" aria-hidden="true"></span>
    </div>
  </section>

  <div class="pad" id="pad" role="button" aria-label="Tap pad" tabindex="0">
    <div class="pad-label">
      <strong>TAP</strong>
      <span>Tap on the beat · pause 2 s to restart</span>
    </div>
  </div>

  <footer class="foot">
    <button id="copyBtn">Copy BPM</button>
    <span class="toast" id="toast"></span>
    <span class="hint">Space / Enter to tap</span>
  </footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const pad = $('pad'), intEl = $('int'), decEl = $('dec'), bpmEl = $('bpm'),
        statusEl = $('status'), dotsEl = $('dots'), clickBtn = $('clickBtn'), toastEl = $('toast');

  const WINDOW = 12;          // taps used for the estimate
  const MIN_GAP = 120;        // ms, ignore double hits (>500 BPM)
  const RESET_AFTER = 2000;   // ms of silence before a new measurement

  let taps = [];              // performance.now() timestamps (last WINDOW taps)
  let tapCount = 0;           // taps since the measurement started; the first one is a downbeat
  let factor = 1;             // ÷2 / ×2
  let estimate = null;        // { interval, bpm, stable }

  for (let i = 0; i < 8; i++) dotsEl.appendChild(document.createElement('i'));

  // least-squares fit of tap time vs tap index: slope = beat interval
  function fit(ts) {
    const n = ts.length;
    if (n < 2) return null;
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sx += i; sy += ts[i]; sxx += i * i; sxy += i * ts[i]; }
    const b = (n * sxy - sx * sy) / (n * sxx - sx * sx);
    const a = (sy - b * sx) / n;
    let sse = 0;
    for (let i = 0; i < n; i++) { const r = ts[i] - (a + b * i); sse += r * r; }
    const jitter = n > 2 ? Math.sqrt(sse / (n - 2)) : Infinity;
    return { interval: b, jitter };
  }

  function tap(t) {
    const last = taps[taps.length - 1];
    if (last !== undefined) {
      const gap = t - last;
      if (gap < MIN_GAP) return;
      const limit = estimate ? Math.max(RESET_AFTER, estimate.interval * 2.2) : RESET_AFTER;
      if (gap > limit) {
        // new measurement: keep showing (and clicking) the tempo as displayed until the 2nd tap
        if (estimate) estimate = { interval: estimate.interval / factor, bpm: estimate.bpm * factor, stable: false };
        taps = []; tapCount = 0; factor = 1;
      } else if (estimate && taps.length >= 4 && (gap < estimate.interval * 0.6 || gap > estimate.interval * 1.6)) {
        // tempo changed a lot: restart from the previous tap
        taps = [last]; tapCount = 1; factor = 1;
      }
    }
    taps.push(t); tapCount++;
    if (taps.length > WINDOW) taps.shift();

    const f = fit(taps);
    if (f) {
      // timing spread grows with the interval: allow 3.5 % of it, never less than 18 ms
      const stable = taps.length >= 6 && f.jitter < Math.max(18, f.interval * 0.035);
      estimate = { interval: f.interval, bpm: 60000 / f.interval, stable };
    }
    flash();
    render();
    syncClick();
    keepAwake();
  }

  function currentBpm() { return estimate ? estimate.bpm * factor : null; }

  function render() {
    const bpm = currentBpm();
    const n = taps.length;
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i < Math.min(n, 8)));
    if (bpm == null) {
      bpmEl.classList.add('idle'); intEl.textContent = '---'; decEl.textContent = '';
      statusEl.textContent = n ? `Keep tapping… ${4 - n} more` : 'Tap 4 times to start';
      statusEl.classList.remove('ok');
      return;
    }
    bpmEl.classList.remove('idle');
    const [whole, tenth] = bpm.toFixed(1).split('.');
    intEl.textContent = whole;
    decEl.textContent = n >= 5 ? '.' + tenth : '';
    if (n < 4) { statusEl.textContent = `Keep tapping… ${4 - n} more`; statusEl.classList.remove('ok'); }
    else if (estimate.stable) { statusEl.textContent = 'Locked'; statusEl.classList.add('ok'); }
    else { statusEl.textContent = 'Settling…'; statusEl.classList.remove('ok'); }
    if (n >= 4) try { localStorage.setItem('tt.bpm', bpm.toFixed(1)); } catch (e) {}
  }

  let hitTimer;
  function flash() {
    pad.classList.add('hit');
    clearTimeout(hitTimer);
    hitTimer = setTimeout(() => pad.classList.remove('hit'), 90);
  }

  function reset() {
    taps = []; tapCount = 0; estimate = null; factor = 1;
    render(); stopClick();
  }

  // input — pointerdown fires immediately, no 300 ms delay
  pad.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); tap(performance.now()); });
  pad.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  pad.addEventListener('touchend', unlockAudio); // on iOS, touchend is the gesture that may (re)start audio
  document.addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd+R, Cmd+T… alone
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyT') {
      if (e.target.closest && e.target.closest('button')) return; // a focused button handles its own keys
      e.preventDefault(); unlockAudio(); tap(performance.now());
    } else if (e.code === 'Escape' || e.code === 'KeyR') reset();
  });
  // a mouse click must not leave focus on a button, or Space would press it again instead of tapping
  document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && e.detail > 0) b.blur(); });
  document.addEventListener('gesturestart', e => e.preventDefault());

  $('resetBtn').addEventListener('click', reset);
  $('halfBtn').addEventListener('click', () => { if (estimate && currentBpm() / 2 >= 20) { factor /= 2; render(); syncClick(); } });
  $('doubleBtn').addEventListener('click', () => { if (estimate && currentBpm() * 2 <= 400) { factor *= 2; render(); syncClick(); } });

  $('copyBtn').addEventListener('click', () => {
    const bpm = currentBpm();
    if (bpm == null) return toast('Tap a tempo first');
    const txt = String(Math.round(bpm * 10) / 10);
    const done = () => toast(`Copied ${txt}`);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => toast(txt));
    else toast(txt);
  });
  let toastTimer;
  function toast(msg) { toastEl.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.textContent = '', 1800); }

  // ---------- click track (Web Audio, phase-locked to your taps) ----------
  let ctx = null, clickOn = false, timer = null, nextBeat = 0, beatIndex = 0, lastBlip = -Infinity;
  function unlockAudio() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      // when audio comes back (after a call, Siri, another app…), re-align the click on the taps
      ctx.onstatechange = () => { if (ctx.state === 'running') syncClick(); };
    }
    // iOS reports 'interrupted', not only 'suspended', after an interruption
    if (ctx.state !== 'running') { const p = ctx.resume(); if (p) p.catch(() => {}); }
  }
  function blip(time, accent) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = accent ? 1760 : 1175;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(accent ? 0.9 : 0.55, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    o.connect(g).connect(ctx.destination);
    o.start(time); o.stop(time + 0.06);
    lastBlip = time;
    const delay = Math.max(0, (time - ctx.currentTime) * 1000);
    setTimeout(() => {
      pad.classList.add('beat'); pad.classList.toggle('accent', accent);
      setTimeout(() => pad.classList.remove('beat', 'accent'), 80);
    }, delay);
  }
  function perfToCtx(t) { return ctx.currentTime + (t - performance.now()) / 1000; }
  function ctxToPerf(c) { return performance.now() + (c - ctx.currentTime) * 1000; }
  // Clicks sit on a grid anchored to your taps: click j sounds at lastTap + (j - idx) × step, where idx
  // is the last tap's place on that grid. The first tap of a measurement is j = 0, an accented beat.
  // Works the same with ÷2 / ×2 (step and idx scale with factor).
  function syncClick() {
    if (!clickOn || !ctx || !estimate || !taps.length) return;
    const step = estimate.interval / factor;
    const lastTap = taps[taps.length - 1];
    const idx = (tapCount - 1) * factor;
    // not in the past, and not right on top of a click that is already scheduled
    const earliest = Math.max(performance.now() + 20, ctxToPerf(lastBlip) + step / 2);
    const j = Math.max(Math.floor(idx) + 1, Math.ceil(idx + (earliest - lastTap) / step));
    nextBeat = perfToCtx(lastTap + (j - idx) * step);
    beatIndex = j;
  }
  function scheduler() {
    if (!estimate || ctx.state !== 'running') return;
    const step = (estimate.interval / factor) / 1000;
    const now = ctx.currentTime;
    if (nextBeat < now - 0.01) {
      // timers were throttled (app or tab in the background): skip the missed clicks, stay on the grid
      const missed = Math.ceil((now - nextBeat) / step);
      nextBeat += missed * step; beatIndex += missed;
    }
    while (nextBeat < now + 0.12) {
      blip(nextBeat, beatIndex % 4 === 0);
      nextBeat += step; beatIndex++;
    }
  }
  function startClick() {
    unlockAudio();
    if (!ctx) return toast('Audio unavailable');
    clickOn = true; clickBtn.setAttribute('aria-pressed', 'true');
    if (estimate) syncClick(); else toast('Tap a tempo first');
    clearInterval(timer); timer = setInterval(scheduler, 25);
    keepAwake();
  }
  function stopClick() {
    clickOn = false; clickBtn.setAttribute('aria-pressed', 'false');
    clearInterval(timer); timer = null;
  }
  clickBtn.addEventListener('click', () => clickOn ? stopClick() : startClick());

  // keep the screen on while you use it (iOS drops the lock whenever the app is hidden)
  let lock = null, locking = false;
  async function keepAwake() {
    if (lock || locking || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    locking = true;
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) {}
    locking = false;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (clickOn) { unlockAudio(); syncClick(); }
    if (clickOn || estimate) keepAwake();
  });

  // show the last tempo as a hint
  try {
    const last = localStorage.getItem('tt.bpm');
    if (last) { statusEl.textContent = `Last: ${last} BPM · tap to start`; }
  } catch (e) {}

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    let controlled = !!navigator.serviceWorker.controller, updateReady = false;
    navigator.serviceWorker.register('sw.js').then(reg => {
      // a home-screen app is usually resumed rather than relaunched: check for updates on every return
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!controlled) { controlled = true; return; } // first install: this page is already current
      updateReady = true;
      if (!clickOn && !estimate) location.reload();   // nothing on screen to lose
    });
    // otherwise load the new version while the app is hidden, so nothing gets interrupted
    document.addEventListener('visibilitychange', () => {
      if (updateReady && document.visibilityState === 'hidden' && !clickOn) location.reload();
    });
  }
})();
</script>
</body>
</html>
